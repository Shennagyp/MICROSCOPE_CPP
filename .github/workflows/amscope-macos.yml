name: Amcam macOS build

on:
  push:
    branches:
      - amscope-native-driver
    paths:
      - "Camera/Amscope/**"
      - "scripts/run-amscope-sdk-probe.sh"
      - "Camera/Common/**"
      - "docs/architecture/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - ".github/workflows/amscope-macos.yml"
  pull_request:
    paths:
      - "Camera/Amscope/**"
      - "scripts/run-amscope-sdk-probe.sh"
      - "Camera/Common/**"
      - "docs/architecture/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - ".github/workflows/amscope-macos.yml"
  workflow_dispatch:

concurrency:
  group: amscope-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-15
            architecture: arm64
            vendor_architecture: x64+arm64
          - name: Intel x86_64
            runner: macos-15-intel
            architecture: x86_64
            vendor_architecture: x64+x86
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang++ --version
          cmake --version

      - name: Install Qt 6
        run: |
          brew install qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure driver, Qt adapter, preview app, and hardware test
        run: |
          cmake -S Camera/Amscope -B build/amscope \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DAMSCOPE_VENDOR_MAC_ARCH="${{ matrix.vendor_architecture }}" \
            -DAMSCOPE_BUILD_QT_ADAPTER=ON \
            -DAMSCOPE_BUILD_PREVIEW_APP=ON \
            -DBUILD_TESTING=ON

      - name: Compile
        run: cmake --build build/amscope --config Release --parallel

      - name: Configure standalone vendor-SDK probe
        run: |
          cmake -S Camera/Amscope/tools/pixel_format_probe -B build/amscope-sdk-probe \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DAMSCOPE_VENDOR_MAC_ARCH="${{ matrix.vendor_architecture }}"

      - name: Build standalone vendor-SDK probe
        run: cmake --build build/amscope-sdk-probe --config Release --parallel

      - name: Verify standalone probe architecture and dependencies
        run: |
          test -x build/amscope-sdk-probe/amscope_sdk_pixel_format_probe
          test -f build/amscope-sdk-probe/libamcam.dylib
          lipo build/amscope-sdk-probe/amscope_sdk_pixel_format_probe -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope-sdk-probe/libamcam.dylib -verify_arch "${{ matrix.architecture }}"
          otool -L build/amscope-sdk-probe/amscope_sdk_pixel_format_probe
          ! otool -L build/amscope-sdk-probe/amscope_sdk_pixel_format_probe | grep -E 'camera_amscope_driver|camera_amscope_qt|Qt'

      - name: Run common camera contract tests
        run: ctest --test-dir build/amscope --output-on-failure

      - name: Verify SDK, libraries, and application architectures
        run: |
          test -f build/amscope/libcamera_amscope_driver.dylib
          test -f build/amscope/libcamera_amscope_qt.a
          test -f build/amscope/libamcam.dylib
          test -x build/amscope/amscope_preview
          test -x build/amscope/amscope_hardware_rate_test
          lipo build/amscope/libcamera_amscope_driver.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/libcamera_amscope_qt.a -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/libamcam.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/amscope_preview -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/amscope_hardware_rate_test -verify_arch "${{ matrix.architecture }}"
          otool -L build/amscope/amscope_preview
          otool -L build/amscope/amscope_hardware_rate_test
          otool -L build/amscope/libcamera_amscope_driver.dylib
          file build/amscope/libcamera_amscope_qt.a

      - name: Confirm preview executable
        run: test -x build/amscope/amscope_preview

      - name: Validate one-command launcher syntax
        run: bash -n scripts/run-amscope.sh

      - name: Validate standalone SDK probe launcher syntax
        run: bash -n scripts/run-amscope-sdk-probe.sh

      - name: Build and run one-command launcher smoke check
        run: scripts/run-amscope.sh --list-cameras
