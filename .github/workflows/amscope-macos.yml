name: AmScope macOS driver

on:
  push:
    branches:
      - amscope-native-driver
      - amscope-native-driver-0.5
      - amscope-native-driver-0.6
      - camera-v.2.0
    paths:
      - "Camera/Amscope/**"
      - "Camera/Common/**"
      - "Camera/Qt/**"
      - "Camera/QtWidgets/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - "Application/OptikaB293/**"
      - "Libraries/**"
      - "CMakeLists.txt"
      - "scripts/run-amscope-native-probe.sh"
      - "scripts/run-amscope-vendor-wait-probe.sh"
      - ".github/workflows/amscope-macos.yml"
  pull_request:
    paths:
      - "Camera/Amscope/**"
      - "Camera/Common/**"
      - "Camera/Qt/**"
      - "Camera/QtWidgets/**"
      - "docs/architecture/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - "Application/OptikaB293/**"
      - "Libraries/**"
      - "CMakeLists.txt"
      - "scripts/run-amscope-native-probe.sh"
      - "scripts/run-amscope-vendor-wait-probe.sh"
      - ".github/workflows/amscope-macos.yml"
  workflow_dispatch:

concurrency:
  group: amscope-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-15
            architecture: arm64
            vendor_architecture: x64+arm64
          - name: Intel x86_64
            runner: macos-15-intel
            architecture: x86_64
            vendor_architecture: x64+x86
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang++ --version
          cmake --version

      - name: Configure non-Qt camera driver and diagnostics
        run: |
          cmake -S Camera/Amscope -B build/amscope \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DAMSCOPE_VENDOR_MAC_ARCH="${{ matrix.vendor_architecture }}" \
            -DAMSCOPE_BUILD_NATIVE_PROBE=ON \
            -DAMSCOPE_BUILD_SDK_WAIT_PROBE=ON \
            -DBUILD_TESTING=ON

      - name: Compile
        run: cmake --build build/amscope --config Release --parallel

      - name: Run non-Qt camera contract and driver tests
        run: ctest --test-dir build/amscope --output-on-failure

      - name: Install and verify non-Qt public headers
        run: |
          cmake --install build/amscope --prefix build/camera-install
          test -f build/camera-install/include/amscope/AmcamCamera.h
          test -f build/camera-install/include/amscope/CameraTypes.h
          test -f build/camera-install/include/camera/CameraFrames.h
          test -f build/camera-install/include/camera/FrameStreamMailbox.h
          test ! -e build/camera-install/include/amscope/QtAmcamCamera.h
          clang++ -std=c++17 -fsyntax-only \
            -I build/camera-install/include \
            Camera/Amscope/tests/AmcamPublicApiTests.cpp

      - name: Verify SDK, driver, diagnostics, and architectures
        run: |
          test -f build/amscope/libcamera_amscope_driver.dylib
          test -f build/amscope/libamcam.dylib
          test -x build/amscope/amscope_native_probe
          test -x build/amscope/amscope_sdk_wait_probe
          lipo build/amscope/libcamera_amscope_driver.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/libamcam.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/amscope_native_probe -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/amscope_sdk_wait_probe -verify_arch "${{ matrix.architecture }}"
          otool -L build/amscope/amscope_native_probe
          otool -L build/amscope/amscope_sdk_wait_probe
          otool -L build/amscope/libcamera_amscope_driver.dylib

      - name: Exercise diagnostic probe help paths
        run: |
          build/amscope/amscope_native_probe --help
          build/amscope/amscope_sdk_wait_probe --help

      - name: Validate non-Qt launcher syntax
        run: |
          bash -n scripts/run-amscope-native-probe.sh
          bash -n scripts/run-amscope-vendor-wait-probe.sh

  qt:
    name: Qt streaming and reusable UI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-15
            architecture: arm64
            vendor_architecture: x64+arm64
          - name: Intel x86_64
            runner: macos-15-intel
            architecture: x86_64
            vendor_architecture: x64+x86
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang++ --version
          cmake --version

      - name: Install Qt 6
        run: |
          brew install qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure Qt streaming adapter, reusable widgets, and preview composition
        run: |
          cmake -S Camera/Amscope -B build/amscope-qt \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DAMSCOPE_VENDOR_MAC_ARCH="${{ matrix.vendor_architecture }}" \
            -DAMSCOPE_BUILD_QT_ADAPTER=ON \
            -DAMSCOPE_BUILD_PREVIEW_APP=ON \
            -DBUILD_TESTING=ON

      - name: Compile Qt libraries, reusable widgets, preview, and tests
        run: cmake --build build/amscope-qt --config Release --parallel

      - name: Run Qt streaming and widget tests
        run: ctest --test-dir build/amscope-qt --output-on-failure

      - name: Verify Qt deliverables and architectures
        run: |
          test -f build/amscope-qt/libcamera_amscope_driver.dylib
          test -f build/amscope-qt/libcamera_amscope_qt.a
          test -f build/amscope-qt/libamcam.dylib
          test -x build/amscope-qt/amscope_preview
          test -x build/amscope-qt/amscope_hardware_rate_test
          lipo build/amscope-qt/libcamera_amscope_driver.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope-qt/libcamera_amscope_qt.a -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope-qt/libamcam.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope-qt/amscope_preview -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope-qt/amscope_hardware_rate_test -verify_arch "${{ matrix.architecture }}"
          otool -L build/amscope-qt/amscope_preview
          otool -L build/amscope-qt/libcamera_amscope_qt.a

  dual-frontend:
    name: SwiftUI and Qt frontends (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang++ --version
          swiftc --version
          cmake --version
          ninja --version

      - name: Install Qt 6
        run: |
          brew install qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure both independent frontends
        run: |
          cmake -S . -B build/dual-frontend -G Ninja \
            -DOPTIKA_BUILD_NATIVE_APP=ON \
            -DOPTIKA_BUILD_AMSCOPE=ON \
            -DOPTIKA_BUILD_GENTL=OFF \
            -DAMSCOPE_BUILD_QT_ADAPTER=ON \
            -DAMSCOPE_BUILD_PREVIEW_APP=ON \
            -DAMSCOPE_VENDOR_MAC_ARCH=x64+arm64 \
            -DBUILD_TESTING=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build SwiftUI, Qt, and test targets
        run: cmake --build build/dual-frontend --config Release --parallel

      - name: Run combined configuration tests
        run: ctest --test-dir build/dual-frontend -C Release --output-on-failure

      - name: Capture Swift test crash backtrace
        if: failure()
        run: |
          TEST=build/dual-frontend/Application/OptikaB293/optika_preview_frame_rate_meter_tests
          if [ -x "$TEST" ]; then
            xcrun lldb --batch -o run -o "thread backtrace all" -- "$TEST" || true
          else
            echo "Swift test executable was not produced: $TEST"
          fi

      - name: Verify both frontend deliverables
        run: |
          test -d build/dual-frontend/Application/OptikaB293/optika_b293_dualslide_app.app
          test -x build/dual-frontend/Application/OptikaB293/optika_b293_dualslide_app.app/Contents/MacOS/optika_b293_dualslide_app
          test -x build/dual-frontend/Camera/Amscope/amscope_preview
          lipo build/dual-frontend/Camera/Amscope/amscope_preview -verify_arch arm64
