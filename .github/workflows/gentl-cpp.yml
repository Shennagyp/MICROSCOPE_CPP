name: Camera GenTL C++ bridge

on:
  push:
    branches:
      - camera-v.2.0
    paths:
      - "Camera/GenTL/**"
      - ".github/workflows/gentl-cpp.yml"
  pull_request:
    branches:
      - camera-v.2.0
    paths:
      - "Camera/GenTL/**"
      - ".github/workflows/gentl-cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-gentl-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GenTL bridge — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-15
            architecture: arm64
          - name: Intel x86_64
            runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S Camera/GenTL -B build/gentl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/gentl --config Release --parallel

      - name: Test
        run: ctest --test-dir build/gentl --output-on-failure

      - name: Verify architecture
        run: |
          lipo build/gentl/libcamera_gentl_consumer_bridge.a -verify_arch "${{ matrix.architecture }}"

      - name: Download official GenICam package
        run: |
          curl --fail --location --retry 3 \
            https://www.emva.org/wp-content/uploads/GenICam_Package_2026.07.zip \
            --output build/GenICam_Package_2026.07.zip
          echo "e74b8d982c3e7697399b03c254b6e8c596eddf0279959eba7de18734e279b64f  build/GenICam_Package_2026.07.zip" | shasum -a 256 --check
          mkdir -p build/genicam-package build/genapi-sdk
          unzip -q build/GenICam_Package_2026.07.zip -d build/genicam-package
          SDK_ZIP="$(find build/genicam-package -type f -name 'GenApi-3.5.1-Mac64_Universal-SDK.zip' -print -quit)"
          test -n "$SDK_ZIP"
          unzip -q "$SDK_ZIP" -d build/genapi-sdk
          GENAPI_HEADER="$(find build/genapi-sdk -path '*/library/CPP/include/GenApi/GenApi.h' -print -quit)"
          test -n "$GENAPI_HEADER"
          GENAPI_ROOT="${GENAPI_HEADER%/library/CPP/include/GenApi/GenApi.h}"
          echo "GENAPI_ROOT=$GENAPI_ROOT" >> "$GITHUB_ENV"

      - name: Configure official GenApi integration
        run: |
          cmake -S Camera/GenTL -B build/gentl-genapi \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DBUILD_TESTING=OFF \
            -DCAMERA_GENTL_ENABLE_GENAPI=ON \
            -DGENAPI_ROOT="$GENAPI_ROOT"

      - name: Build official GenApi integration
        run: cmake --build build/gentl-genapi --config Release --parallel

      - name: Verify GenApi architecture
        run: |
          lipo build/gentl-genapi/libcamera_gentl_genapi.a -verify_arch "${{ matrix.architecture }}"
