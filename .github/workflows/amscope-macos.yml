name: Amcam macOS build

on:
  push:
    branches:
      - amscope-native-driver
    paths:
      - "Camera/Amscope/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - ".github/workflows/amscope-macos.yml"
  pull_request:
    paths:
      - "Camera/Amscope/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - ".github/workflows/amscope-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-15
            architecture: arm64
            vendor_architecture: x64+arm64
          - name: Intel x86_64
            runner: macos-15-intel
            architecture: x86_64
            vendor_architecture: x64+x86
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang++ --version
          cmake --version

      - name: Install Qt 6
        run: |
          brew install qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure native driver and Qt adapter
        run: |
          cmake -S Camera/Amscope -B build/amscope \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DAMSCOPE_VENDOR_MAC_ARCH="${{ matrix.vendor_architecture }}" \
            -DAMSCOPE_BUILD_QT_ADAPTER=ON

      - name: Compile
        run: cmake --build build/amscope --config Release --parallel

      - name: Verify SDK and driver architectures
        run: |
          test -f build/amscope/libamscope_driver.dylib
          test -f build/amscope/libamscope_qt.dylib
          test -f build/amscope/libamcam.dylib
          lipo -verify_arch "${{ matrix.architecture }}" build/amscope/libamscope_driver.dylib
          lipo -verify_arch "${{ matrix.architecture }}" build/amscope/libamscope_qt.dylib
          lipo -verify_arch "${{ matrix.architecture }}" build/amscope/libamcam.dylib
          otool -L build/amscope/libamscope_driver.dylib
          otool -L build/amscope/libamscope_qt.dylib
