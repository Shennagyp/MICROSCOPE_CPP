name: AmScope macOS driver

on:
  push:
    branches:
      - amscope-native-driver
      - amscope-native-driver-0.5
      - amscope-native-driver-0.6
      - camera-v.2.0
    paths:
      - "Camera/Amscope/**"
      - "Camera/Common/**"
      - "docs/architecture/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - "scripts/run-amscope-native-probe.sh"
      - "scripts/run-amscope-vendor-wait-probe.sh"
      - ".github/workflows/amscope-macos.yml"
  pull_request:
    paths:
      - "Camera/Amscope/**"
      - "Camera/Common/**"
      - "docs/architecture/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/inc/**"
      - "Camera/VendorSDK/AmscopeVendorSDK/mac/**"
      - "scripts/run-amscope-native-probe.sh"
      - "scripts/run-amscope-vendor-wait-probe.sh"
      - ".github/workflows/amscope-macos.yml"
  workflow_dispatch:

concurrency:
  group: amscope-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-15
            architecture: arm64
            vendor_architecture: x64+arm64
          - name: Intel x86_64
            runner: macos-15-intel
            architecture: x86_64
            vendor_architecture: x64+x86
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang++ --version
          cmake --version

      - name: Configure non-Qt camera driver and diagnostics
        run: |
          cmake -S Camera/Amscope -B build/amscope \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DAMSCOPE_VENDOR_MAC_ARCH="${{ matrix.vendor_architecture }}" \
            -DAMSCOPE_BUILD_NATIVE_PROBE=ON \
            -DAMSCOPE_BUILD_SDK_WAIT_PROBE=ON \
            -DBUILD_TESTING=ON

      - name: Compile
        run: cmake --build build/amscope --config Release --parallel

      - name: Run non-Qt camera contract and driver tests
        run: ctest --test-dir build/amscope --output-on-failure

      - name: Install and verify non-Qt public headers
        run: |
          cmake --install build/amscope --prefix build/camera-install
          test -f build/camera-install/include/amscope/AmcamCamera.h
          test -f build/camera-install/include/amscope/CameraTypes.h
          test -f build/camera-install/include/camera/CameraFrames.h
          test -f build/camera-install/include/camera/FrameStreamMailbox.h
          test ! -e build/camera-install/include/amscope/QtAmcamCamera.h
          clang++ -std=c++17 -fsyntax-only \
            -I build/camera-install/include \
            Camera/Amscope/tests/AmcamPublicApiTests.cpp

      - name: Verify SDK, driver, diagnostics, and architectures
        run: |
          test -f build/amscope/libcamera_amscope_driver.dylib
          test -f build/amscope/libamcam.dylib
          test -x build/amscope/amscope_native_probe
          test -x build/amscope/amscope_sdk_wait_probe
          lipo build/amscope/libcamera_amscope_driver.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/libamcam.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/amscope_native_probe -verify_arch "${{ matrix.architecture }}"
          lipo build/amscope/amscope_sdk_wait_probe -verify_arch "${{ matrix.architecture }}"
          otool -L build/amscope/amscope_native_probe
          otool -L build/amscope/amscope_sdk_wait_probe
          otool -L build/amscope/libcamera_amscope_driver.dylib

      - name: Exercise diagnostic probe help paths
        run: |
          build/amscope/amscope_native_probe --help
          build/amscope/amscope_sdk_wait_probe --help

      - name: Validate non-Qt launcher syntax
        run: |
          bash -n scripts/run-amscope-native-probe.sh
          bash -n scripts/run-amscope-vendor-wait-probe.sh
