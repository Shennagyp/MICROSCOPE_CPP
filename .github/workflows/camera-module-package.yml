name: Camera Module package and external consumers
on:
  push:
    branches: [camera-v.2.0]
    paths:
      - "Camera/**"
      - ".github/workflows/camera-module-package.yml"
  pull_request:
    branches: [camera-v.2.0]
    paths:
      - "Camera/**"
      - ".github/workflows/camera-module-package.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-module-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-consumers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-15
            architecture: arm64
            vendor_architecture: x64+arm64
          - name: Intel x86_64
            runner: macos-15-intel
            architecture: x86_64
            vendor_architecture: x64+x86
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Download official GenICam package
        run: |
          mkdir -p build
          curl --fail --location --retry 3 \
            https://www.emva.org/wp-content/uploads/GenICam_Package_2026.07.zip \
            --output build/GenICam_Package_2026.07.zip
          echo "e74b8d982c3e7697399b03c254b6e8c596eddf0279959eba7de18734e279b64f  build/GenICam_Package_2026.07.zip" | shasum -a 256 --check
          mkdir -p build/genicam-package build/genapi-sdk
          unzip -q build/GenICam_Package_2026.07.zip -d build/genicam-package
          GENAPI_HEADER="$(find build/genicam-package -path '*/library/CPP/include/GenApi/GenApi.h' -print -quit)"
          if [ -z "$GENAPI_HEADER" ]; then
            SDK_ARCHIVE="$(find build/genicam-package -type f | grep -Ei 'Mac64.*SDK.*(zip|tar[.]gz|tgz)' | head -n 1 || true)"
            test -n "$SDK_ARCHIVE"
            case "$SDK_ARCHIVE" in
              *.zip) unzip -q "$SDK_ARCHIVE" -d build/genapi-sdk ;;
              *.tar.gz|*.tgz) tar -xzf "$SDK_ARCHIVE" -C build/genapi-sdk ;;
            esac
            RUNTIME_ARCHIVE="$(find build/genicam-package -type f -name 'GenApi-3.5.1-Mac64_Universal-Runtime.tar.gz' -print -quit)"
            test -n "$RUNTIME_ARCHIVE"
            tar -xzf "$RUNTIME_ARCHIVE" -C build/genapi-sdk
            GENAPI_HEADER="$(find build/genapi-sdk -path '*/library/CPP/include/GenApi/GenApi.h' -print -quit)"
          fi
          test -n "$GENAPI_HEADER"
          GENAPI_ROOT="$(cd "${GENAPI_HEADER%/library/CPP/include/GenApi/GenApi.h}" && pwd)"
          GENAPI_CMAKE_DIR="$GENAPI_ROOT/cmake/Mac64_Universal"
          test -f "$GENAPI_ROOT/library/CPP/include/GenApi/GenApi.h"
          test -f "$GENAPI_CMAKE_DIR/GenApiConfig.cmake"
          echo "GENAPI_ROOT=$GENAPI_ROOT" >> "$GITHUB_ENV"
          echo "GENAPI_CMAKE_DIR=$GENAPI_CMAKE_DIR" >> "$GITHUB_ENV"

      - name: Configure package
        run: |
          cmake -S Camera -B build/camera-module \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
            -DAMSCOPE_VENDOR_MAC_ARCH="${{ matrix.vendor_architecture }}" \
            -DCAMERA_MODULE_BUILD_AMSCOPE=ON \
            -DCAMERA_MODULE_BUILD_GENTL=ON \
            -DCAMERA_MODULE_INSTALL_AMSCOPE_VENDOR_RUNTIME=ON \
            -DCAMERA_MODULE_BUILD_GENAPI=ON \
            -DGENAPI_ROOT="$GENAPI_ROOT" \
            -DGenApi_DIR="$GENAPI_CMAKE_DIR" \
            -DBUILD_TESTING=ON
      - name: Build package libraries and tests
        run: cmake --build build/camera-module --config Release --parallel
      - name: Run package tests
        run: ctest --test-dir build/camera-module -C Release --output-on-failure
      - name: Install and relocate package
        run: |
          cmake --install build/camera-module --prefix build/camera-install
          cmake -E copy_directory build/camera-install build/camera-relocated
      - name: Configure clean external consumers
        run: |
          cmake -S Camera/tests/consumers/common -B build/consumer-common -DCMAKE_PREFIX_PATH="$PWD/build/camera-relocated" -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          cmake -S Camera/tests/consumers/gentl -B build/consumer-gentl -DCMAKE_PREFIX_PATH="$PWD/build/camera-relocated" -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_GenApi=TRUE
          cmake -S Camera/tests/consumers/amscope -B build/consumer-amscope -DCMAKE_PREFIX_PATH="$PWD/build/camera-relocated" -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          cmake -S Camera/tests/consumers/genapi -B build/consumer-genapi -DCMAKE_PREFIX_PATH="$PWD/build/camera-relocated" -DGenApi_DIR="$GENAPI_CMAKE_DIR" -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
      - name: Build clean external consumers
        run: |
          cmake --build build/consumer-common --config Release --parallel
          cmake --build build/consumer-gentl --config Release --parallel
          cmake --build build/consumer-amscope --config Release --parallel
          cmake --build build/consumer-genapi --config Release --parallel

      - name: Verify installed runtime loading and link paths
        run: |
          test -f build/camera-relocated/lib/libcamera_amscope_driver.dylib
          test -f build/camera-relocated/lib/libamcam.dylib
          otool -L build/camera-relocated/lib/libcamera_amscope_driver.dylib
          otool -L build/consumer-amscope/camera_module_amscope_consumer
          otool -L build/consumer-genapi/camera_module_genapi_consumer
          lipo build/camera-relocated/lib/libcamera_amscope_driver.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/camera-relocated/lib/libamcam.dylib -verify_arch "${{ matrix.architecture }}"
          lipo build/camera-relocated/lib/libcamera_gentl_consumer_bridge.a -verify_arch "${{ matrix.architecture }}"
          lipo build/camera-relocated/lib/libcamera_gentl_genapi.a -verify_arch "${{ matrix.architecture }}"
          lipo build/consumer-amscope/camera_module_amscope_consumer -verify_arch "${{ matrix.architecture }}"
          lipo build/consumer-genapi/camera_module_genapi_consumer -verify_arch "${{ matrix.architecture }}"
          SIMULATOR_CTI="$(find build/camera-module -type f -name gentl_test_simulator.cti -print -quit)"
          test -n "$SIMULATOR_CTI"
          build/consumer-common/camera_module_common_consumer
          build/consumer-gentl/camera_module_gentl_consumer "$SIMULATOR_CTI"
          build/consumer-amscope/camera_module_amscope_consumer
          build/consumer-genapi/camera_module_genapi_consumer

      - name: Verify vendor runtime bundling is opt-in
        if: matrix.architecture == 'arm64'
        run: |
          cmake -S Camera -B build/camera-no-vendor-runtime \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DAMSCOPE_VENDOR_MAC_ARCH=x64+arm64 \
            -DCAMERA_MODULE_BUILD_AMSCOPE=ON \
            -DCAMERA_MODULE_BUILD_GENTL=OFF \
            -DCAMERA_MODULE_BUILD_QT=OFF \
            -DCAMERA_MODULE_BUILD_QT_WIDGETS=OFF \
            -DCAMERA_MODULE_BUILD_AMSCOPE_QT=OFF \
            -DCAMERA_MODULE_INSTALL_AMSCOPE_VENDOR_RUNTIME=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build/camera-no-vendor-runtime --target amscope_driver --config Release --parallel
          cmake --install build/camera-no-vendor-runtime --prefix build/camera-no-vendor-install
          test ! -f build/camera-no-vendor-install/lib/libamcam.dylib
          grep -q "set(CameraModule_Amscope_VENDOR_RUNTIME_INCLUDED FALSE)" \
            build/camera-no-vendor-install/lib/cmake/CameraModule/CameraModuleConfig.cmake
