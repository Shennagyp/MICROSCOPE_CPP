name: Microscope platform libraries

on:
  push:
    branches:
      - OPTIKA-B293-DUALSLIDE-APP-v.0.9
    paths:
      - "CMakeLists.txt"
      - "Libraries/**"
      - "Camera/Common/**"
      - "docs/architecture/MICROSCOPE_CORE_APPLICATION_CONTRACTS_V0.9.md"
      - ".github/workflows/microscope-platform.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "Libraries/**"
      - "Camera/Common/**"
      - "docs/architecture/MICROSCOPE_CORE_APPLICATION_CONTRACTS_V0.9.md"
      - ".github/workflows/microscope-platform.yml"
  workflow_dispatch:

concurrency:
  group: microscope-platform-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-libraries:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            runner: ubuntu-latest
          - name: macOS Clang
            runner: macos-latest
          - name: Windows MSVC
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite3 for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "VCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV

      - name: Configure Core standalone
        run: cmake -S Libraries/Microscope.Core -B build/core -DBUILD_TESTING=ON
        shell: bash

      - name: Build Core standalone
        run: cmake --build build/core --config Release --parallel
        shell: bash

      - name: Test Core standalone
        run: ctest --test-dir build/core -C Release --output-on-failure
        shell: bash

      - name: Configure Application standalone
        run: |
          if [[ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]]; then
            cmake -S Libraries/Microscope.Application -B build/application \
              -DBUILD_TESTING=ON \
              -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
              -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET"
          else
            cmake -S Libraries/Microscope.Application -B build/application -DBUILD_TESTING=ON
          fi
        shell: bash

      - name: Build Application standalone
        run: cmake --build build/application --config Release --parallel
        shell: bash

      - name: Test Application standalone
        run: ctest --test-dir build/application -C Release --output-on-failure
        shell: bash

      - name: Configure root platform-only composition
        run: |
          if [[ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]]; then
            cmake -S . -B build/platform \
              -DOPTIKA_BUILD_AMSCOPE=OFF \
              -DOPTIKA_BUILD_NATIVE_APP=OFF \
              -DBUILD_TESTING=ON \
              -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
              -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET"
          else
            cmake -S . -B build/platform \
              -DOPTIKA_BUILD_AMSCOPE=OFF \
              -DOPTIKA_BUILD_NATIVE_APP=OFF \
              -DBUILD_TESTING=ON
          fi
        shell: bash

      - name: Build root platform-only composition
        run: cmake --build build/platform --config Release --parallel
        shell: bash

      - name: Test root platform-only composition
        run: ctest --test-dir build/platform -C Release --output-on-failure
        shell: bash
